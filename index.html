<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Order Fiktif Malang Raya</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14252b;--mute:#5a6b72;--bg:#e8ecee;--card:#fff;--line:#d3dbde;--amber:#f2b705;--ok:#1f8a5b;--warn:#d98e00;--bad:#c8372d;--forest:#2d5248;--r-card:14px;--r-btn:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Public Sans",system-ui,sans-serif}
.stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--amber) 10px 20px)}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 clamp(2rem,9vw,2.8rem)/1.02 Archivo,system-ui,sans-serif;margin:8px 0 10px;letter-spacing:-.02em}
.sub{margin:0 0 4px;color:var(--mute)}
#stat{margin:0 0 16px}
.demo{background:#fff6d6;border:1px solid #ecd37a;border-radius:10px;padding:8px 12px;font-size:.85rem;margin:0 0 16px}
.search{display:block;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--card);font:inherit;color:inherit}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.act{border:0;border-radius:var(--r-card);padding:16px;text-align:left;font:inherit;cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:6px}
.act b{font:800 1.15rem/1.15 Archivo,sans-serif}
.act span{font-size:.88rem;opacity:.85}
.act.a1{background:var(--ink);color:#fff}
.act.a1 b{color:var(--amber)}
.act.a2{background:var(--card);color:var(--ink);border:2px solid var(--bad)}
.act.a2 b{color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font:600 .9rem "Public Sans",sans-serif;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 12px}
h2{font:800 1.3rem Archivo,sans-serif;margin:0}
#count{color:var(--mute);font-size:.9rem}
.rep{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-bottom:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;width:76px;flex:none}
.pl{width:100%;text-align:center;padding:10px 4px;border-radius:10px;font:800 .8rem Archivo,sans-serif;color:#fff}
.p-Shopee{background:#e8472b}.p-Gojek{background:#0b8f2a}.p-Grab{background:#00724a}.p-Maxim{background:var(--amber);color:var(--ink)}.p-Lainnya{background:#4a5d66}
.vic{font-size:.78rem;font-weight:700;color:var(--bad)}
.body{flex:1;min-width:0}
.body h3{font:700 1rem/1.3 "Public Sans",sans-serif;margin:0 0 2px;overflow-wrap:anywhere}
.body p{margin:0 0 8px;color:var(--mute);font-size:.9rem}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--mute)}
.meta strong{color:var(--ink);font:800 1.05rem Archivo,sans-serif}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.st{font-size:.78rem;font-weight:700;color:var(--mute)}
.st.ok{color:var(--ok)}
.vote{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 .8rem "Public Sans",sans-serif;color:var(--ink);cursor:pointer}
.vote:disabled{opacity:.5;cursor:default}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r-card);padding:24px 16px;text-align:center;color:var(--mute)}
.note{font-size:.8rem;color:var(--mute);margin-top:24px}
dialog{border:0;border-radius:20px 20px 0 0;padding:0;width:100%;max-width:640px;margin:auto auto 0;max-height:92vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,37,43,.55)}
.sheet{padding:20px 16px 28px}
.sheet h2{margin-bottom:4px}
.sheet>p{margin:0 0 14px;color:var(--mute);font-size:.9rem}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-btn);font:inherit;background:#fff;color:inherit}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{margin:0;font-weight:600}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.radios input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.radios input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.cek-sub{margin:0 0 14px;color:var(--mute);font-size:.9rem}
.cek-sec{margin-top:16px}
.cek-sec-title{display:block;font-weight:700;font-size:.95rem;margin:0 0 8px;color:var(--ink)}
.app-pills{display:flex;flex-wrap:wrap;gap:8px}
.app-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid #d7dedb;background:#f8faf9;color:var(--ink);font:700 .9rem "Public Sans",sans-serif;cursor:pointer;margin:0}
.app-pill input{position:absolute;opacity:0;pointer-events:none}
.dot-badge{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex:none}
.b-Shopee{background:#e8472b}.b-Gojek{background:#0b8f2a}.b-Grab{background:#00724a}.b-Maxim{background:#f2b705;color:var(--ink)!important}.b-Lainnya{background:#5a6b72}
.app-pill:has(input:checked){background:var(--forest);border-color:var(--forest);color:#fff}
.opt-cards{display:flex;flex-direction:column;gap:8px}
.opt-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #dce2e0;border-radius:12px;background:#f9fbfa;cursor:pointer;margin:0;font-weight:500;font-size:.92rem;line-height:1.35}
.opt-card input{position:absolute;opacity:0;pointer-events:none}
.radio-ui{width:18px;height:18px;border-radius:50%;border:2px solid #9aa8a3;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff}
.radio-ui::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--forest);transform:scale(0);transition:transform .12s ease}
.opt-card:has(input:checked){border-color:var(--forest);background:#f1f6f4;font-weight:600}
.opt-card:has(input:checked) .radio-ui{border-color:var(--forest)}
.opt-card:has(input:checked) .radio-ui::after{transform:scale(1)}
.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:var(--r-btn);padding:14px;font:800 1rem Archivo,sans-serif;background:var(--bad);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.btn.alt.ok{border-color:var(--ok);color:var(--ok);background:#f1fbf6}
.light{display:flex;gap:14px;align-items:center;margin-top:16px;padding:14px;border-radius:var(--r-card);background:var(--ink);color:#fff}
.dots{display:flex;flex-direction:column;gap:6px}
.dots i{width:18px;height:18px;border-radius:50%;background:#34454c}
.light[data-l="0"] .dots i:nth-child(3){background:#3ddc84}
.light[data-l="1"] .dots i:nth-child(2){background:var(--amber)}
.light[data-l="2"] .dots i:nth-child(1){background:#ff5b4f}
.light b{display:block;font:800 1.3rem Archivo,sans-serif}
.light span{font-size:.9rem;opacity:.9}
.hit{margin-top:10px;font-size:.88rem;background:#fde8e5;border-radius:10px;padding:8px 12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:99;max-width:90%;text-align:center}
#toast[hidden]{display:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.rep{transition:border-color .15s}.rep:hover{border-color:var(--ink)}}
#map{height:260px;border-radius:var(--r-card);border:1px solid var(--line);z-index:0}
.mapnote,.hint{font-size:.8rem;color:var(--mute);margin:6px 0 14px}
.panti-btn{display:block;width:100%;margin:0 0 14px;padding:12px 16px;border:1px dashed var(--ink);border-radius:var(--r-btn);background:transparent;font:700 .95rem "Public Sans",sans-serif;color:var(--ink);cursor:pointer;text-align:left}
.pt{border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-top:10px}
.pt h3{font:700 1rem/1.3 "Public Sans",sans-serif;margin:0 0 2px}
.pt p{margin:0 0 10px;font-size:.88rem;color:var(--mute)}
.pt .row{display:flex;gap:8px}
.pt a{flex:1;text-align:center;padding:10px;border-radius:var(--r-btn);background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:.9rem}
.pt a.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.filter-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
<h1>Radar Order Fiktif Malang Raya</h1>
<p class="sub">Cek dulu sebelum jalan, hemat bensin.</p>
<p id="stat"></p>
<p class="demo" id="demo" hidden>Mode demo: laporan hanya tersimpan di HP ini. Sambungkan Supabase supaya semua driver bisa melihat laporan yang sama.</p>

<input class="search" id="q" type="search" placeholder="Cari jalan, gang, kecamatan, modus" aria-label="Cari laporan">

<div class="actions">
  <button class="act a1" id="openCek"><b>Cek risiko order</b><span>Nilai orderan yang baru masuk</span></button>
  <button class="act a2" id="openLapor"><b>Lapor order fiktif</b><span>Biar driver lain tidak zonk</span></button>
</div>

<button class="panti-btn" id="openPanti">Kena order fiktif? Sedekahkan ke panti terdekat</button>
<div class="chips" id="chips" role="group" aria-label="Filter
